name: Build LODEX Cal.diy image

# LODEX fork image pipeline
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package.json"
      - "yarn.lock"
      - ".yarn/**"
      - "apps/web/**"
      - "apps/api/v2/**"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/lodex-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lodex-caldiy-image-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Start build database
        run: |
          docker compose up -d database
          for i in {1..30}; do
            if docker exec database pg_isready -U unicorn_user -d calendso; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs database
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=container:database
          buildkitd-flags: |
            --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cal.diy
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000
            NEXT_PUBLIC_API_V2_URL=http://localhost:5555/api/v2
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            CALCOM_TELEMETRY_DISABLED=1
            DATABASE_URL=postgresql://unicorn_user:magical_password@database:5432/calendso
            DATABASE_DIRECT_URL=postgresql://unicorn_user:magical_password@database:5432/calendso
            NEXTAUTH_SECRET=build-only-secret
            CALENDSO_ENCRYPTION_KEY=00000000000000000000000000000000

      - name: Summary
        run: |
          echo "### Cal.diy image" >> "$GITHUB_STEP_SUMMARY"
          echo "Fork: \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`ghcr.io/${{ github.repository_owner }}/cal.diy:main\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup build database
        if: always()
        run: |
          docker rm -f database >/dev/null 2>&1 || true
          docker network rm stack >/dev/null 2>&1 || true
