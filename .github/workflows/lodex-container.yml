name: Build LODEX Cal.diy image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package.json"
      - "yarn.lock"
      - ".yarn/**"
      - "apps/web/**"
      - "apps/api/v2/**"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/lodex-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lodex-caldiy-image-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cal.diy
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000
            NEXT_PUBLIC_API_V2_URL=http://localhost:5555/api/v2
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            CALCOM_TELEMETRY_DISABLED=1
            DATABASE_URL=postgresql://caldiy:build-only@127.0.0.1:5432/caldiy
            DATABASE_DIRECT_URL=postgresql://caldiy:build-only@127.0.0.1:5432/caldiy
            NEXTAUTH_SECRET=build-only-secret
            CALENDSO_ENCRYPTION_KEY=00000000000000000000000000000000

      - name: Summary
        run: |
          echo "### Cal.diy image" >> "$GITHUB_STEP_SUMMARY"
          echo "Fork: \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`ghcr.io/${{ github.repository_owner }}/cal.diy:main\`" >> "$GITHUB_STEP_SUMMARY"
